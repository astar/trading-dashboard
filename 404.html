const d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function go(){
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err'); err.textContent='';
  try{
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:d(P.salt), iterations:P.iters, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:d(P.iv)}, key, d(P.ct));
    const htmlStr = new TextDecoder().decode(pt);
    document.open(); document.write(htmlStr); document.close();
  }catch(e){ err.textContent='Wrong password.'; }
}
